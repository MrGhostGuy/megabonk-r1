function getNearestEnemy(x,y,rng,exclude){
  rng=rng||9999;let best=null,bd=rng;
  for(const e of S.enemies){if(e===exclude||e.hp<=0)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;best=e}}

function dealDmg(e,dmg,p,cr){
  e.hp-=dmg;e.flash=5;p.totalDmgD+=dmg;
  if(e.hp<=0)killEnemy(e,p);
  dmgNum(e.x,e.y-5,Math.ceil(dmg),cr);
}
function killEnemy(e,p){
  p.totalKills++;p.killN=(p.killN||0)+1;S.runKills++;META.stats.totalKills++;
  let xp=e.xp*p.xpMult;if(p.bonusXP&&Math.random()<0.12)xp*=2;
  spawnXP(e.x,e.y,xp);
  let g=e.gold*p.goldMult;spawnGold(e.x,e.y,g);
  if((p.hok||0)>0&&Math.random()<p.hok)p.hp=Math.min(p.hp+1,p.maxHp*(1+(p.overhealC||0)));
  if((p.hpPerKill||0)>0&&p.killN<=100){p.maxHp+=p.hpPerKill;p.hp=Math.min(p.hp+p.hpPerKill,p.maxHp)}
  if((p.lifesteal||0)>0){const h=Math.ceil(p.lifesteal);p.hp=Math.min(p.hp+h,p.maxHp*(1+(p.overhealC||0)))}
  if(p.critHeal&&Math.random()<p.critHeal)p.hp=Math.min(p.hp+1,p.maxHp);
  if(p.soulHarvest){for(let i=0;i<2;i++){const a=TAU*i/2;S.projectiles.push({x:e.x,y:e.y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,dmg:5*p.dmgMult,life:60,sz:4,col:'#9b59b6',hm:true,hmRng:120,fromP:true})}}

function fireWeapon(p,w){
  let dir=p.lastDir;
  let best=null,bd=1e9;for(const e of S.enemies){const d=(e.x-p.x)*(e.x-p.x)+(e.y-p.y)*(e.y-p.y);if(d<bd){bd=d;best=e}}
  if(best)dir={x:best.x-p.x,y:best.y-p.y};
  const a=Math.atan2(dir.y,dir.x);
  const count=w.n+(p.projBonus||0);
  let dmg=w.dmg*p.dmgMult*p.sizeMult;
  const sz=w.sz*p.sizeMult,spd=w.spd*p.projSpd,dur=(w.dur||60)*p.dur;
  let idleM=1;if(p.idleDmg&&!p.moving&&p._idleT)idleM=Math.min(2,1+p._idleT/60);
  if(p.gamerG){const r=1-(p.hp/p.maxHp);idleM*=(1+r*2)}
  if(w.lowHp){const r=1-(p.hp/p.maxHp);idleM*=(1+r)}
  const fd=dmg*idleM;
  if(w.type==='melee'){
    const range=sz,arc=w.arc||TAU*0.4;
    for(const e of S.enemies){const d=dist(e,p),ea=Math.atan2(e.y-p.y,e.x-p.x);let ad=Math.abs(((ea-a+Math.PI*3)%(TAU))-Math.PI);if(d<range+e.sz&&ad<arc/2){let wd2=fd*(1+(p.meleeDmg||0));const cr=Math.random()<p.crit;if(cr)wd2*=p.critDmg;if(p.critExplode&&cr){part(e.x,e.y,'#e74c3c',8);for(const e2 of S.enemies){if(dist(e2,e)<25&&e2!==e)dealDmg(e2,wd2*0.5,p)}}dealDmg(e,wd2,p,cr);if(e.stun<=0){const ka=Math.atan2(e.y-p.y,e.x-p.x);e.vx+=Math.cos(ka)*3*p.knockback;e.vy+=Math.sin(ka)*3*p.knockback}applyOnHit(p,e,wd2)}}
    if(w.pShoot)S.projectiles.push({x:p.x,y:p.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg:fd*0.5,life:dur,sz:sz*0.6,col:w.col,pierce:0,fromP:true});
    if(w.sw)for(const e of S.enemies){if(dist(e,p)<sz+10)e.stun=20}
    part(p.x+Math.cos(a)*sz*0.5,p.y+Math.sin(a)*sz*0.5,w.col,3);
  } else if(w.type==='aura'){for(const e of S.enemies){if(dist(e,p)<sz+e.sz){dealDmg(e,fd,p);applyOnHit(p,e,fd)}}}
  else if(w.type==='proj'||w.type==='boom'){
    const sp=count>1?0.15:0;
    for(let i=0;i<count;i++){const sa=a+(i-(count-1)/2)*sp;const pr={x:p.x,y:p.y,vx:Math.cos(sa)*spd,vy:Math.sin(sa)*spd,dmg:fd,life:dur,sz,col:w.col,pierce:w.pierce||0,bounce:w.bounce||0,spin:w.spin||false,angle:sa,fromP:true,wp:w,kb:w.kb||0};if(w.type==='boom'){pr._ox=p.x;pr._oy=p.y;pr._bmd=0;pr._bmp=0;pr._boom=true}if(w.dice)pr.dmg=fd*randI(1,6);if(w.spread){pr.vx=Math.cos(a+rand(-w.spread,w.spread))*spd;pr.vy=Math.sin(a+rand(-w.spread,w.spread))*spd}S.projectiles.push(pr)}
  } else if(w.type==='home'){const near=getNearestEnemy(p.x,p.y,w.rng||100);if(near){const ta=Math.atan2(near.y-p.y,near.x-p.x);for(let i=0;i<count;i++){const sa=ta+(i-(count-1)/2)*0.2;S.projectiles.push({x:p.x,y:p.y,vx:Math.cos(sa)*spd,vy:Math.sin(sa)*spd,dmg:fd,life:dur,sz,col:w.col,pierce:0,hm:true,hmRng:w.rng||100,fromP:true,wp:w})}}
  } else if(w.type==='chain'){const near=getNearestEnemy(p.x,p.y,w.chainR||60);if(near)S.projectiles.push({x:p.x,y:p.y,target:near,dmg:fd,life:dur,sz,col:w.col,chainR:w.chainR||60,chainN:w.chainN||3,chained:0,fromP:true,wp:w,_chain:true})}
  else if(w.type==='cone'){for(let i=0;i<count;i++){const sa=a+(i-(count-1)/2)*0.15;S.projectiles.push({x:p.x,y:p.y,vx:Math.cos(sa)*spd,vy:Math.sin(sa)*spd,dmg:fd,life:dur,sz,col:w.col,pierce:0,cone:true,fromP:true,wp:w})}
  } else if(w.type==='mine'){S.projectiles.push({x:p.x+Math.cos(a)*20,y:p.y+Math.sin(a)*20,vx:0,vy:0,dmg:fd,life:600,sz,col:w.col,mine:true,armed:false,_armT:30,aoe:w.aoe||20,fromP:true,wp:w})}
  else if(w.type==='grav'){S.projectiles.push({x:p.x,y:p.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg:fd,life:dur,sz,col:w.col,grav:true,gravS:0.5,fromP:true,wp:w})}
}
function updateWeapons(p,dt){
  for(const w of p.weapons){w._t=(w._t||0)+dt;const cd=w.cd/(16.67*p.atkSpd*(p.shrineBuff==='atk'?1.5:1));if(w._t>=cd){w._t=0;fireWeapon(p,w)}}
  if(p.flexCd<3){p.flexT=(p.flexT||0)+dt;if(p.flexT>=p.flexCd*60){p.flexT=0;for(const e of S.enemies){if(dist(e,p)<60){e.stun=30;part(e.x,e.y,'#f1c40f',3)}}}}
  if(p.energyOrbs){p._eT=(p._eT||0)+dt;if(p._eT>=20){p._eT=0;const n=getNearestEnemy(p.x,p.y);if(n){const a=Math.atan2(n.y-p.y,n.x-p.x);S.projectiles.push({x:p.x,y:p.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,dmg:8,life:90,sz:4,col:'#2c3e50',pierce:0,fromP:true})}}}

function updateProjectiles(dt){
  for(let i=S.projectiles.length-1;i>=0;i--){
    const pr=S.projectiles[i];pr.life-=dt;
    if(pr.life<=0){S.projectiles.splice(i,1);continue}
    if(pr._chain){if(!pr.target||pr.target.hp<=0)pr.target=getNearestEnemy(pr.x,pr.y,pr.chainR);if(pr.target){const a=Math.atan2(pr.target.y-pr.y,pr.target.x-pr.x);pr.x+=Math.cos(a)*4;pr.y+=Math.sin(a)*4;if(dist(pr,pr.target)<pr.target.sz+pr.sz){dealDmg(pr.target,pr.dmg,S.player);pr.chained++;if(pr.chained>=pr.chainN){S.projectiles.splice(i,1);continue}pr.target=getNearestEnemy(pr.x,pr.y,pr.chainR)}}for(const e of S.enemies){if(dist(e,pr)<e.sz+pr.sz)dealDmg(e,pr.dmg*0.3,S.player)}continue}
    if(pr._boom){pr._bmd+=Math.hypot(pr.vx,pr.vy);pr._bmp+=dt*0.1;if(pr._bmd>80){const a=Math.atan2(S.player.y-pr.y,S.player.x-pr.x);pr.vx=Math.cos(a)*3;pr.vy=Math.sin(a)*3}pr.x+=pr.vx;pr.y+=pr.vy}
    else if(pr.hm){const n=getNearestEnemy(pr.x,pr.y,pr.hmRng||120);if(n){const a=Math.atan2(n.y-pr.y,n.x-pr.x);const spd=Math.hypot(pr.vx,pr.vy);pr.vx=lerp(pr.vx,Math.cos(a)*spd,0.1);pr.vy=lerp(pr.vy,Math.sin(a)*spd,0.1)}pr.x+=pr.vx;pr.y+=pr.vy}
    else if(pr.grav){pr.x+=pr.vx;pr.y+=pr.vy;for(const e of S.enemies){const d=dist(e,pr);if(d<60&&d>5){const a=Math.atan2(pr.y-e.y,pr.x-e.x);e.vx+=Math.cos(a)*pr.gravS;e.vy+=Math.sin(a)*pr.gravS}if(d<pr.sz+e.sz)dealDmg(e,pr.dmg*0.1,S.player)}}
    else if(pr.mine){pr._armT=(pr._armT||0)-dt;if(pr._armT<=0)pr.armed=true;if(pr.armed){let hit=false;for(const e of S.enemies){if(dist(e,pr)<pr.sz+e.sz){for(const e2 of S.enemies){if(dist(e2,pr)<pr.aoe)dealDmg(e2,pr.dmg,S.player)}part(pr.x,pr.y,'#e74c3c',10);S.screenShake=5;hit=true;break}}if(hit){S.projectiles.splice(i,1)}continue}}
    else if(pr.spin){pr.angle+=0.15;pr.x+=pr.vx;pr.y+=pr.vy}
    else{pr.x+=pr.vx;pr.y+=pr.vy}
    if(pr.bounce>0&&pr._bounced===undefined)pr._bounced=false;
    if(pr.fromP){for(let j=S.enemies.length-1;j>=0;j--){const e=S.enemies[j];if(dist(e,pr)<e.sz+pr.sz){let dmg=pr.dmg;const cr=Math.random()<S.player.crit;if(cr){dmg*=S.player.critDmg;if(S.player.megaCrit&&Math.random()<S.player.megaCrit)dmg*=2}dealDmg(e,dmg,S.player,cr);applyOnHit(S.player,e,dmg);if(pr.wp&&pr.wp.fx&&Math.random()<(pr.wp.fxC||0))e.effects.push({type:pr.wp.fx,dmg:(pr.wp.fxD||2)*S.player.dmgMult,dur:pr.wp.fxT||60,t:0});if(pr.kb&&e.stun<=0){const ka=Math.atan2(e.y-pr.y,e.x-pr.x);e.vx+=Math.cos(ka)*pr.kb;e.vy+=Math.sin(ka)*pr.kb}if(pr.pierce>0)pr.pierce--;else if(pr.bounce>0&&!pr._bounced){pr._bounced=true;pr.bounce--;const n=getNearestEnemy(pr.x,pr.y,60,e);if(n){const a=Math.atan2(n.y-pr.y,n.x-pr.x);const s=Math.hypot(pr.vx,pr.vy);pr.vx=Math.cos(a)*s;pr.vy=Math.sin(a)*s}}else{S.projectiles.splice(i,1);break}}}
    }else if(S.player&&dist(S.player,pr)<8+pr.sz){dmgPlayer(S.player,pr.dmg);S.projectiles.splice(i,1)}
  }
}

function updateEnemies(dt){
  const p=S.player;
  for(let i=S.enemies.length-1;i>=0;i--){
    const e=S.enemies[i];
    if(e.stun>0){e.stun-=dt;continue}
    for(let k=e.effects.length-1;k>=0;k--){const ef=e.effects[k];ef.t+=dt;if((ef.type==='poison'||ef.type==='burn')&&ef.t%15===0)e.hp-=ef.dmg;if(ef.type==='freeze'){e.stun=Math.max(e.stun,1);if(ef.t>=ef.dur){e.effects.splice(k,1);if(p.frozenN)p.frozenN--}continue}if(ef.type==='bloodmark'&&ef.t>=60){e.hp-=ef.dmg*ef.stacks;e.effects.splice(k,1);continue}if(ef.t>=ef.dur)e.effects.splice(k,1)}
    if(e.hp<=0){killEnemy(e,p);continue}
    e.bob+=0.05;
    if(e.float){e.x+=Math.sin(e.bob)*0.3;e.y+=Math.cos(e.bob*0.7)*0.3}
    const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);
    if(e.healer){
      e.healT=(e.healT||0)+dt;
      if(e.healT>=90){e.healT=0;let healed=false;for(const e2 of S.enemies){if(e2!==e&&e2.hp<e2.maxHp&&dist(e2,e)<50){e2.hp=Math.min(e2.maxHp,e2.hp+3);part(e2.x,e2.y,'#2ecc71',3);healed=true}}if(healed)part(e.x,e.y,'#e91e8c',4)}
      if(d<70){e.vx=lerp(e.vx,-(dx/d)*e.spd,0.1);e.vy=lerp(e.vy,-(dy/d)*e.spd,0.1)}
      else if(d>110){e.vx=lerp(e.vx,(dx/d)*e.spd,0.1);e.vy=lerp(e.vy,(dy/d)*e.spd,0.1)}
      else{e.vx*=0.95;e.vy*=0.95}
    }
    else if(e.charger){
      if(e.dashing>0){e.dashing-=dt;e.vx=lerp(e.vx,(dx/d)*e.spd*5,0.3);e.vy=lerp(e.vy,(dy/d)*e.spd*5,0.3);if(S.t%3===0)part(e.x,e.y,'#d35400',2)}
      else{e.dashT-=dt;if(e.dashT<=0){e.dashT=randI(180,300);e.dashing=25;e.flash=10}
        if(d>1){e.vx=lerp(e.vx,(dx/d)*e.spd,0.08);e.vy=lerp(e.vy,(dy/d)*e.spd,0.08)}}
    }
    else if(e.bomber){
      if(e.fuse>0){e.fuse-=dt;e.flash=3;if(e.fuse<=0){part(e.x,e.y,'#e67e22',15);S.screenShake=8;for(const e2 of S.enemies){if(dist(e2,e)<35&&e2!==e)dealDmg(e2,5,p)}if(dist(p,e)<35)dmgPlayer(p,e.dmg);const idx2=S.enemies.indexOf(e);if(idx2>=0)S.enemies.splice(idx2,1);S.kills++;continue}}
      else if(d<25){e.fuse=35}
      else if(d>1){e.vx=lerp(e.vx,(dx/d)*e.spd,0.12);e.vy=lerp(e.vy,(dy/d)*e.spd,0.12)}
    }
    else if(e.rng&&d<e.rng&&d>e.sz*2){
      if(e.keepsDist&&d<e.rng*0.6){e.vx=lerp(e.vx,-(dx/d)*e.spd,0.1);e.vy=lerp(e.vy,-(dy/d)*e.spd,0.1)}
      e.sht=(e.sht||0)+dt;
      if(e.sht>=e.scd){e.sht=0;const a=Math.atan2(dy,dx);S.projectiles.push({x:e.x,y:e.y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,dmg:e.dmg,life:120,sz:3,col:e.col,fromP:false});part(e.x,e.y,e.col,2)}
    }
    else{if(d>1){e.vx=lerp(e.vx,(dx/d)*e.spd,0.1);e.vy=lerp(e.vy,(dy/d)*e.spd,0.1)}}
    if(S.t%5===Math.floor(e.id%5)){for(const e2 of S.enemies){if(e2!==e){const dd=dist(e2,e);if(dd<e.sz+e2.sz&&dd>0){const sep=(e.sz+e2.sz-dd)*0.05;const a2=Math.atan2(e.y-e2.y,e.x-e2.x);e.vx+=Math.cos(a2)*sep;e.vy+=Math.sin(a2)*sep}}}}
    if(e.airborne>0){e.airborne--;e.vy-=0.2}
    e.x+=e.vx;e.y+=e.vy;e.vx*=0.85;e.vy*=0.85;
    e.x=clamp(e.x,4,S.worldW-4);e.y=clamp(e.y,4,S.worldH-4);
    if(dist(e,p)<e.sz+8){dmgPlayer(p,e.dmg);const ka=Math.atan2(p.y-e.y,p.x-e.x);p.vx=(p.vx||0)+Math.cos(ka)*4;p.vy=(p.vy||0)+Math.sin(ka)*4}
    if(e.flash>0)e.flash-=dt;
  }
}

function dmgPlayer(p,dmg){
  if(p.invuln>0)return;
  if(p.zaWarudo&&!p.zaUsed){p.zaUsed=true;p.invuln=600;part(p.x,p.y,'#f1c40f',15);return}
  if(Math.random()<p.evade){if(p.phantomB){p._phantomB=true;p._phantomT=60}part(p.x,p.y,'#b0e0e6',3);return}
  if(p.mirror&&p._mirrT<=0){p._mirrT=180;p.invuln=30;for(const e of S.enemies){if(dist(e,p)<80)dealDmg(e,dmg*2,p)}part(p.x,p.y,'#b0e0e6',8);return}
  dmg*=1-(p.armor||0);if(p.shield>0){const sd=Math.min(p.shield,dmg);p.shield-=sd;dmg-=sd}
  p.hp-=dmg;p.totalDmgT+=dmg;p.invuln=15;S.screenShake=Math.min(dmg,8);S.hitFlash=8;
  if(p.thorns>0)for(const e of S.enemies){if(dist(e,p)<40){dealDmg(e,p.thorns,p);if(p.thornsExplode&&Math.random()<0.5){part(e.x,e.y,'#27ae60',5);for(const e2 of S.enemies){if(dist(e2,e)<25&&e2!==e)dealDmg(e2,p.thorns*0.5,p)}}}}
  if(p.cactusN>0)for(const e of S.enemies){if(dist(e,p)<35)dealDmg(e,p.thorns*p.cactusN,p)}
  if(p.dmgSpdBoost){p.moveSpd=1.5*1.3;p._spdBT=120}
  if(p.goldOnHit>0)S.gold+=p.goldOnHit;
  if(p.toxicHit)for(const e of S.enemies){if(dist(e,p)<30)e.effects.push({type:'poison',dmg:2*p.dmgMult,dur:45,t:0})}
  if(p.elecHit)for(const e of S.enemies){if(dist(e,p)<30)dealDmg(e,5*p.dmgMult,p)}
  if(p.kevin&&Math.random()<0.25)for(const e of S.enemies){if(dist(e,p)<50)dealDmg(e,3*p.dmgMult,p)}
  if(p.hp<=0&&META.metaUps.revive&&!p.revived){p.revived=true;p.hp=p.maxHp*0.5;p.invuln=120;part(p.x,p.y,'#f1c40f',20);announce('REVIVED!');return}
}
function updatePlayer(dt){

  let mx=0,my=0;
  if(keys['ArrowUp']||keys['w'])my-=1;if(keys['ArrowDown']||keys['s'])my+=1;
  if(keys['ArrowLeft']||keys['a'])mx-=1;if(keys['ArrowRight']||keys['d'])mx+=1;
  if(mx||my){const len=Math.hypot(mx,my);mx/=len;my/=len;p.lastDir={x:mx,y:my};p.moving=true;p.moveDist+=p.moveSpd*dt;if(p.cid==='calcium')p.calciumSpd=Math.min(p.calciumSpd+0.001,2);if(p.zapOnMove)p.zapCharge=Math.min(p.zapCharge+dt*0.5,100);if(p.goldMove&&p.moveDist>20){p.moveDist-=20;S.gold+=1;S.runGold+=1}if(p.bobDead&&p.moveDist>14){p.moveDist-=14;const a=rand(0,TAU);S.projectiles.push({x:p.x+Math.cos(a)*30,y:p.y+Math.sin(a)*30,vx:0,vy:0,dmg:15*p.dmgMult,life:30,sz:8,col:'#7f8c8d',fromP:true})}p._idleT=0;
    p.trailT+=dt;
    if(p.trailT>3){p.trailT=0;const tr=META.cosmetics.trail;
      if(tr==='fire')S.particles.push({x:p.x+rand(-3,3),y:p.y+rand(-3,3),vx:rand(-.5,.5),vy:rand(-1,-.3),life:20,maxL:20,col:pick(['#e74c3c','#e67e22','#f39c12']),sz:2});
      else if(tr==='sparkle')S.particles.push({x:p.x+rand(-4,4),y:p.y+rand(-4,4),vx:rand(-.3,.3),vy:rand(-.5,.5),life:25,maxL:25,col:pick(['#f1c40f','#fff','#f39c12']),sz:2});
      else if(tr==='blood')S.particles.push({x:p.x+rand(-2,2),y:p.y+rand(-2,2),vx:rand(-.4,.4),vy:rand(.2,.8),life:22,maxL:22,col:'#c0392b',sz:2});
      else if(tr==='rainbow')S.particles.push({x:p.x+rand(-4,4),y:p.y+rand(-4,4),vx:rand(-.4,.4),vy:rand(-.4,.4),life:24,maxL:24,col:'hsl('+((S.t*3)%360)+',100%,60%)',sz:2});
    }
  }else{p.moving=false;if(p.cid==='calcium')p.calciumSpd=Math.max(1,p.calciumSpd-0.002)}
  if(p.canFloat&&keys[' ']){p.vz=(p.vz||0)-0.3*dt;p.floating=true}else{p.floating=false}
  if(p.vz){p.z+=p.vz;p.vz*=0.95;if(p.z<0){p.z=0;p.vz=0;p.onGround=true}}
  const spd=p.moveSpd*(p.calciumSpd||1)*(p.shrineBuff==='spd'?1.3:1);p.x+=mx*spd*dt;p.y+=my*spd*dt;
  p.x=clamp(p.x,8,S.worldW-8);p.y=clamp(p.y,8,S.worldH-8);

  if(p.regen>0){p._rT=(p._rT||0)+dt;if(p._rT>=60){p._rT=0;p.hp=Math.min(p.hp+p.regen,p.maxHp*(1+(p.overhealC||0)))}}
  if(p.maxShield>0&&p.shield<p.maxShield){p._sT=(p._sT||0)+dt;if(p._sT>=120){p._sT=0;p.shield=Math.min(p.shield+1,p.maxShield)}}
  if(p.invuln>0)p.invuln-=dt;if(p._slurpT>0)p._slurpT-=dt;if(p._spdBT>0)p._spdBT-=dt;else if(p.dmgSpdBoost)p.moveSpd=1.5;
  if(p.thornsFromArmor)p.thorns+=(p.armor||0)*2;
  updateWeapons(p,dt);S.camX=clamp(p.x-W/2,0,S.worldW-W);S.camY=clamp(p.y-H/2,0,S.worldH-H);
}
function updateDrops(dt){
  for(let i=S.drops.length-1;i>=0;i--){const d=S.drops[i];d.life-=dt;d.x+=d.vx;d.y+=d.vy;d.vx*=0.95;d.vy*=0.95;if(d.bob!==undefined)d.bob+=0.1;if(S.player){const dx=S.player.x-d.x,dy=S.player.y-d.y,dd=Math.hypot(dx,dy);if(dd<55*S.player.pickupR*(S.player.shrineBuff==='mag'?3:1)){const a=Math.atan2(dy,dx);d.vx+=Math.cos(a)*2;d.vy+=Math.sin(a)*2}if(dd<10||d.life<=0){if(dd<10){if(d.t==='xp'){S.xp+=d.val;checkLevelUp()}else if(d.t==='gold'){S.gold+=d.val;S.runGold+=d.val}}S.drops.splice(i,1)}}}
  for(let i=S.particles.length-1;i>=0;i--){const p=S.particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=dt;p.vx*=0.9;p.vy*=0.9;if(p.life<=0)S.particles.splice(i,1)}
  for(let i=S.damageNums.length-1;i>=0;i--){const d=S.damageNums[i];d.y-=0.5;d.life-=dt;if(d.life<=0)S.damageNums.splice(i,1)}
}

function updateInteractables(){

    const ib=S.interactables[i];
    if(ib.t==='chest'&&!ib.open&&dist(ib,p)<14){
      ib.open=true;playChime();part(ib.x,ib.y,'#f39c12',10);S.screenShake=3;
      const roll=Math.random()*(1+(p.freeChest||0));
      if(roll<0.35){const g=randI(10,25);S.gold+=g;S.runGold+=g;spawnGold(ib.x,ib.y,8);announce('+'+g+' GOLD')}
      else if(roll<0.55){const wp=pick(p.weapons);wp.level=Math.min(wp.level+1,wp.maxLvl);wp.dmg=Math.ceil(wp.dmg*1.15);announce(wp.name+' UP!');part(ib.x,ib.y,'#e74c3c',8)}
      else if(roll<0.75){const ids=Object.keys(ITEMS);const id=pick(ids);const it=ITEMS[id];p.items.push(id);if(it.e)it.e(p);announce('ITEM: '+it.name);part(ib.x,ib.y,'#9b59b6',8)}
      else{const h=Math.ceil(p.maxHp*0.2);p.hp=Math.min(p.hp+h,p.maxHp);announce('+'+h+' HP');part(ib.x,ib.y,'#2ecc71',8)}
      S.interactables.splice(i,1);
    }
    else if(ib.t==='shrine'&&!ib.used&&dist(ib,p)<14){
      ib.used=true;playChime();part(ib.x,ib.y,'#3498db',12);
      const buff=pick(['dmg','atk','spd','mag']);

}
function announce(txt){S.waveAnnounce=80;S.waveAnnounceSub=txt}
function playChime(){try{if(window.AudioContext){window._ac=window._ac||new AudioContext();const o=window._ac.createOscillator(),g=window._ac.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.08,window._ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,window._ac.currentTime+0.2);o.connect(g);g.connect(window._ac.destination);o.start();o.stop(window._ac.currentTime+0.2)}}catch(e){}}

function checkLevelUp(){
  while(S.xp>=S.xpToLevel){
    S.xp-=S.xpToLevel;S.level++;
    S.xpToLevel=Math.floor(S.xpToLevel*1.15+5);
    if(S.level>META.stats.bestLevel)META.stats.bestLevel=S.level;
    const c=CHARS[S.player.cid];if(c&&c.ap)c.ap(S.player);
    if(S.player.diceHead){const s=pick(['dmgMult','maxHp','moveSpd','atkSpd','crit','luck','regen','thorns']);if(s==='dmgMult')S.player.dmgMult+=0.05;else if(s==='maxHp'){S.player.maxHp+=10;S.player.hp+=10}else if(s==='moveSpd')S.player.moveSpd+=0.05;else if(s==='atkSpd')S.player.atkSpd+=0.05;else if(s==='crit')S.player.crit+=0.03;else if(s==='luck')S.player.luck+=0.05;else if(s==='regen')S.player.regen+=0.5;else if(s==='thorns')S.player.thorns+=3}
    generateLevelUpChoices();
    S.screen='levelup';S.paused=true;saveMeta();
  }
}
function generateLevelUpChoices(){
  S.levelUpChoices=[];const types=['weapon','item','tome'];
  const p=S.player;
  const evoMap={firestaff:'Inferno Staff',sword:'Blood Blade',bone:'Bone Storm',aura:'Holy Aura',axe:'Executioner Axe',revolver:'Desperado',bow:'Storm Bow',katana:'Void Katana',shotgun:'Doomsayer'};
  const evoCandidates=[];
  if(p){for(const w of p.weapons){if(w.level>=w.maxLvl){const wKey=Object.keys(WPS).find(k=>WPS[k].name===w.name);if(wKey&&evoMap[wKey]&&(!p.evolvedW||!p.evolvedW.includes(w.name))){evoCandidates.push(w)}}}}
  for(let i=0;i<3;i++){
    if(evoCandidates.length>0&&Math.random()<0.4){
      const w=evoCandidates.splice(0,1)[0];const wKey=Object.keys(WPS).find(k=>WPS[k].name===w.name);
      S.levelUpChoices.push({type:'evolve',data:w,evoName:evoMap[wKey]||('Evolved '+w.name)});
      continue;
    }
    const t=pick(types);
    if(t==='weapon'){
      const a=Object.keys(WPS).filter(w=>S.unlocks.weapons.includes(w));
      const w=pick(a);S.levelUpChoices.push({type:'weapon',id:w,data:WPS[w]});
    }else if(t==='item'){
      const a=Object.keys(ITEMS).filter(it=>S.unlocks.items.includes(it)||Math.random()<0.3);
      if(a.length){const id=pick(a);S.levelUpChoices.push({type:'item',id,data:ITEMS[id]})}
      else{const id=pick(Object.keys(TOMES));S.levelUpChoices.push({type:'tome',id,data:TOMES[id]})}
    }else{const id=pick(Object.keys(TOMES));S.levelUpChoices.push({type:'tome',id,data:TOMES[id]})}
  }
}
function applyChoice(choice){
  const p=S.player;
  if(choice.type==='evolve'){const w=choice.data;w.name=choice.evoName;w.dmg=Math.round(w.dmg*2.5);w.level=w.maxLvl+1;w.maxLvl=15;if(!p.evolvedW)p.evolvedW=[];p.evolvedW.push(choice.evoName);w.cd=Math.max(8,Math.round(w.cd*0.7));S.screen='game';S.paused=false;part(p.x,p.y,'#f1c40f',20);return}
  if(choice.type==='weapon'){const w=choice.data;const ex=p.weapons.find(wp=>wp.name===w.name);if(ex){ex.level=Math.min(ex.level+1,ex.maxLvl);ex.dmg=Math.ceil(ex.dmg*1.1);ex.sz+=0.5}else p.weapons.push(Object.assign({},w,{level:1,xp:0,xp2Lvl:5,maxLvl:8}))}
  else if(choice.type==='item'){const it=choice.data;p.items.push(choice.id);if(it.e)it.e(p)}
  else if(choice.type==='tome'){const tm=choice.data;const k=tm.s;if(!p.tomes[k])p.tomes[k]=0;p.tomes[k]++;if(tm.s==='dmgMult')p.dmgMult+=tm.v;else if(tm.s==='maxHp'){p.maxHp+=tm.v;p.hp=Math.min(p.hp+tm.v,p.maxHp)}else if(tm.s==='moveSpd')p.moveSpd+=tm.v;else if(tm.s==='atkSpd')p.atkSpd+=tm.v;else if(tm.s==='evade')p.evade+=tm.v;else if(tm.s==='goldMult')p.goldMult+=tm.v;else if(tm.s==='knockback')p.knockback+=tm.v;else if(tm.s==='crit')p.crit+=tm.v;else if(tm.s==='projSpd')p.projSpd+=tm.v;else if(tm.s==='regen')p.regen+=tm.v;else if(tm.s==='maxShield'){p.maxShield+=tm.v;p.shield+=tm.v}else if(tm.s==='silverMult')p.silverMult+=tm.v;else if(tm.s==='sizeMult')p.sizeMult+=tm.v;else if(tm.s==='armor')p.armor+=tm.v;else if(tm.s==='pickupR')p.pickupR+=tm.v;else if(tm.s==='lifesteal')p.lifesteal+=tm.v;else if(tm.s==='dur')p.dur+=tm.v;else if(tm.s==='luck')p.luck+=tm.v;else if(tm.s==='projBonus')p.projBonus+=tm.v;else if(tm.s==='thorns')p.thorns+=tm.v;else if(tm.s==='xpMult')p.xpMult+=tm.v;else if(tm.s==='diffMult')p.diffMult+=tm.v}
  S.screen='game';S.paused=false;
}

function spawnWave(){
  const w=S.wave;
  const count=3+Math.floor(w*1.5);
  const types=['grunt','grunt','runner'];
  if(w>=2)types.push('skeleton','goblin');
  if(w>=3)types.push('shooter','swarmer','swarmer');
  if(w>=4)types.push('mage','bomber');
  if(w>=5)types.push('tank','charger');
  if(w>=7)types.push('splitter','healer');
  if(w>=10)types.push('scorpion','wisp');
  for(let i=0;i<count;i++){
    const angle=rand(0,TAU),dd=rand(160,260);
    spawnEnemy(pick(types),clamp(S.player.x+Math.cos(angle)*dd,20,S.worldW-20),clamp(S.player.y+Math.sin(angle)*dd,20,S.worldH-20));
  }
  if(w>=4&&Math.random()<0.15+w*0.01){
    const angle=rand(0,TAU),dd=rand(180,240);
    spawnEnemy('elite',clamp(S.player.x+Math.cos(angle)*dd,20,S.worldW-20),clamp(S.player.y+Math.sin(angle)*dd,20,S.worldH-20));
  }
  if(w%5===0&&!S.bossActive){
    const bossType=w>=20?'finalBoss':'boss';
    const a=spawnEnemy(bossType,clamp(S.player.x+rand(-200,200),40,S.worldW-40),clamp(S.player.y+rand(-200,200),40,S.worldH-40),1+w*0.06);
    S.bossActive=true;S.boss=a;
    announce('WAVE '+w+' - BOSS!');
    S.screenShake=8;
  }else if(w>1){
    announce('WAVE '+w);
  }
  if(w%3===0&&S.interactables.length<4)spawnChest(rand(60,S.worldW-60),rand(60,S.worldH-60));
  if(w%4===0&&S.interactables.filter(i2=>i2.t==='shrine').length<2)spawnShrine(rand(60,S.worldW-60),rand(60,S.worldH-60));
  S.difficulty=1+w*0.12;
  S.spawnRate=Math.max(45,120-w*2);
  if(w>META.stats.bestWave)META.stats.bestWave=w;
  saveMeta();
}

function checkAchievements(){
  for(const ach of ACHIEVEMENTS){
    if(!META.achievements[ach.id]&&ach.check()){
      META.achievements[ach.id]=true;
      if(ach.reward)META.cosmetics['_unlock_'+ach.reward]=true;
      saveMeta();
    }
  }
}

function drawEnemySprite(e){
  const x=e.x,y=e.y,sz=e.sz;
  ctx.save();
  const bodyCol=e.flash>0?'#fff':e.col;
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x,y+sz*0.6,sz*0.7,sz*0.25,0,0,TAU);ctx.fill();
  ctx.fillStyle=bodyCol;
  if(e.type==='tank'){ctx.fillRect(x-sz,y-sz*0.8,sz*2,sz*1.6);ctx.fillStyle=e.flash>0?'#fff':'#555';ctx.fillRect(x-sz,y-sz*0.3,sz*2,sz*0.6)}
  else if(e.type==='runner'){ctx.beginPath();ctx.ellipse(x,y,sz*0.6,sz*1.1,0,0,TAU);ctx.fill()}
  else if(e.type==='skeleton'){ctx.fillRect(x-sz*0.5,y-sz,sz,sz*2);ctx.beginPath();ctx.arc(x,y-sz,sz*0.6,0,TAU);ctx.fill()}
  else{ctx.beginPath();ctx.arc(x,y,sz,0,TAU);ctx.fill()}
  if(S.player&&e.type!=='skeleton'){
    const ea=Math.atan2(S.player.y-y,S.player.x-x);
    const ex=Math.cos(ea)*sz*0.3,ey=Math.sin(ea)*sz*0.3;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x-sz*0.35+ex,y-sz*0.2+ey,sz*0.22,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(x+sz*0.35+ex,y-sz*0.2+ey,sz*0.22,0,TAU);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(x-sz*0.35+ex*1.5,y-sz*0.2+ey*1.5,sz*0.1,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(x+sz*0.35+ex*1.5,y-sz*0.2+ey*1.5,sz*0.1,0,TAU);ctx.fill();
  }else if(e.type==='skeleton'){
    ctx.fillStyle='#000';
    ctx.fillRect(x-sz*0.5,y-sz*1.2,sz*0.4,sz*0.4);ctx.fillRect(x+sz*0.1,y-sz*1.2,sz*0.4,sz*0.4);
  }
  if(e.type==='goblin'){ctx.fillStyle=bodyCol;ctx.beginPath();ctx.moveTo(x-sz,y-sz*0.4);ctx.lineTo(x-sz*1.4,y-sz*1.2);ctx.lineTo(x-sz*0.5,y-sz*0.8);ctx.fill();ctx.beginPath();ctx.moveTo(x+sz,y-sz*0.4);ctx.lineTo(x+sz*1.4,y-sz*1.2);ctx.lineTo(x+sz*0.5,y-sz*0.8);ctx.fill()}
  else if(e.type==='mage'){ctx.fillStyle='#2c3e50';ctx.beginPath();ctx.moveTo(x-sz*0.7,y-sz*0.8);ctx.lineTo(x+sz*0.7,y-sz*0.8);ctx.lineTo(x,y-sz*2);ctx.fill()}
  else if(e.type==='bomber'){ctx.fillStyle=e.fuse>0&&(S.t%6<3)?'#fff':'#c0392b';ctx.beginPath();ctx.arc(x,y,sz*0.5,0,TAU);ctx.fill();if(e.fuse>0){ctx.strokeStyle='#f39c12';ctx.beginPath();ctx.moveTo(x,y-sz);ctx.lineTo(x+rand(-2,2),y-sz*1.8);ctx.stroke()}}
  else if(e.type==='splitter'){ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.moveTo(x,y-sz);ctx.lineTo(x-2,y);ctx.lineTo(x+2,y+sz);ctx.stroke()}
  else if(e.type==='charger'){if(e.dashing>0){ctx.strokeStyle='#f39c12';ctx.beginPath();ctx.moveTo(x-sz*1.5,y);ctx.lineTo(x-sz*2.5,y);ctx.moveTo(x+sz*1.5,y);ctx.lineTo(x+sz*2.5,y);ctx.stroke()}}
  else if(e.type==='healer'){ctx.fillStyle='#fff';ctx.fillRect(x-1,y-sz*0.5,2,sz);ctx.fillRect(x-sz*0.5,y-1,sz,2)}
  else if(e.type==='wisp'){ctx.globalAlpha=0.6;ctx.fillStyle='#87ceeb';ctx.beginPath();ctx.arc(x,y,sz*1.5,0,TAU);ctx.fill();ctx.globalAlpha=1}
  else if(e.type==='scorpion'){ctx.strokeStyle=bodyCol;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-sz,sz*0.8,Math.PI,TAU);ctx.stroke()}
  if(e.elite){ctx.fillStyle='#f1c40f';ctx.beginPath();ctx.moveTo(x-sz*0.6,y-sz*1.1);ctx.lineTo(x-sz*0.6,y-sz*1.8);ctx.lineTo(x-sz*0.2,y-sz*1.3);ctx.lineTo(x,y-sz*1.9);ctx.lineTo(x+sz*0.2,y-sz*1.3);ctx.lineTo(x+sz*0.6,y-sz*1.8);ctx.lineTo(x+sz*0.6,y-sz*1.1);ctx.fill()}
  if(e.boss){ctx.fillStyle=e.type==='finalBoss'?'#9b59b6':'#e74c3c';ctx.beginPath();ctx.moveTo(x-sz*0.6,y-sz*0.8);ctx.lineTo(x-sz*1.1,y-sz*1.8);ctx.lineTo(x-sz*0.2,y-sz*0.9);ctx.fill();ctx.beginPath();ctx.moveTo(x+sz*0.6,y-sz*0.8);ctx.lineTo(x+sz*1.1,y-sz*1.8);ctx.lineTo(x+sz*0.2,y-sz*0.9);ctx.fill()}
  ctx.restore();

  }
}

// ============ INPUT ============
let touchMoveActive=false,touchMoveId=null,touchMoveStart={x:0,y:0};
C.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=C.getBoundingClientRect();
  for(const t of e.changedTouches){
    const x=(t.clientX-r.left)*(W/r.width),y=(t.clientY-r.top)*(H/r.height);
    if(S.screen==='title'){
      if(y>95&&y<180){const idx=Math.floor((y-95)/18);S.menuIdx=clamp(idx,0,3);titleAction()}
      else if(y>=180)titleAction();
    }
    else if(S.screen==='achievements'){S.screen='title'}
    else if(S.screen==='charSelect'){
      const chars=Object.keys(CHARS),cols=4,cw=56,ch=52,ox=(W-cw*cols)/2+4,oy=24;
      let hit=false;
      for(let i=0;i<chars.length;i++){
        const col=i%cols,row=Math.floor(i/cols),cx=ox+col*cw,cy=oy+row*ch;
        if(x>=cx-1&&x<cx+cw-7&&y>=cy-1&&y<cy+ch-5){
          const cid=chars[i];
          if(S.selectedChar===cid){
            if(META.charUnlocks[cid]||cid==='fox'||cid==='sirOofie')startGame();
            else{const cost=CHAR_COSTS[cid]||100;if(META.gold>=cost){META.gold-=cost;META.charUnlocks[cid]=true;saveMeta();playChime()}}
          }else S.selectedChar=cid;
          hit=true;break;
        }
      }
      if(!hit&&y>H-20)S.screen='title';
    }
    else if(S.screen==='shop'){
      if(y>30&&y<30+META_UPGRADES.length*24){const idx=Math.floor((y-30)/24);S.shopIdx=clamp(idx,0,META_UPGRADES.length-1);buyUpgrade(S.shopIdx)}
      if(y>H-14)S.screen='title';
    }
    else if(S.screen==='locker'){
      if(y>34&&y<34+COSMETICS.length*22){const idx=Math.floor((y-34)/22);buyCosmetic(clamp(idx,0,COSMETICS.length-1))}
      if(y>H-14)S.screen='title';
    }
    else if(S.screen==='levelup'){
      const ch=Math.floor(x/(W/3));
      if(ch>=0&&ch<3&&S.levelUpChoices[ch])applyChoice(S.levelUpChoices[ch]);
    }
    else if(S.screen==='paused'){S.screen='game';S.paused=false}
    else if(S.screen==='gameover'){resetGame();S.screen='title'}
    else if(S.screen==='game'){
      if(x>W-24&&y>H-56){S.screen='paused';S.paused=true}
      else if(x<W*0.45){touchMoveActive=true;touchMoveId=t.identifier;touchMoveStart={x:t.clientX,y:t.clientY}}
    }
  }
},{passive:false});
C.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!touchMoveActive||S.screen!=='game')return;
  for(const t of e.changedTouches){
    if(t.identifier===touchMoveId){
      const dx=t.clientX-touchMoveStart.x,dy=t.clientY-touchMoveStart.y;
      keys['ArrowLeft']=dx<-14;keys['ArrowRight']=dx>14;
      keys['ArrowUp']=dy<-14;keys['ArrowDown']=dy>14;
    }
  }
},{passive:false});
C.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===touchMoveId){touchMoveActive=false;touchMoveId=null;keys['ArrowLeft']=false;keys['ArrowRight']=false;keys['ArrowUp']=false;keys['ArrowDown']=false}
  }
},{passive:false});
let lastWheelT=0;
window.addEventListener('wheel',e=>{
  const now=performance.now();if(now-lastWheelT<120)return;lastWheelT=now;
  const dir=e.deltaY>0?1:-1;
  if(S.screen==='title'){S.menuIdx=clamp(S.menuIdx+dir,0,3)}
  else if(S.screen==='charSelect'){
    const chars=Object.keys(CHARS),i=chars.indexOf(S.selectedChar);
    S.selectedChar=chars[(i+dir+chars.length)%chars.length];
  }
  else if(S.screen==='shop'){S.shopIdx=clamp(S.shopIdx+dir,0,META_UPGRADES.length-1)}
  else if(S.screen==='gameover'){resetGame();S.screen='title'}
},{passive:true});
function titleAction(){
  if(S.menuIdx===0)S.screen='charSelect';
  else if(S.menuIdx===1)S.screen='shop';
  else if(S.menuIdx===2)S.screen='locker';
  else if(S.menuIdx===3)S.screen='achievements';
}
function buyUpgrade(idx){
  const up=META_UPGRADES[idx];if(!up)return;
  const bought=META.metaUps[up.id]||0;
  if(bought>=up.max||META.gold<up.cost)return;
  META.gold-=up.cost;META.metaUps[up.id]=bought+1;saveMeta();playChime();
}
function buyCosmetic(idx){
  const cos=COSMETICS[idx];if(!cos)return;
  const owned=cos.cost===0||META.cosmetics['_unlock_'+cos.id];
  if(owned){META.cosmetics.trail=cos.id;saveMeta();return}
  if(META.gold<cos.cost)return;
  META.gold-=cos.cost;META.cosmetics['_unlock_'+cos.id]=true;META.cosmetics.trail=cos.id;saveMeta();playChime();
}
function handleInput(){
  if(S.screen==='title'){
    if(keys['Enter']){titleAction();keys['Enter']=false}
    if(keys['ArrowDown']){S.menuIdx=clamp(S.menuIdx+1,0,3);keys['ArrowDown']=false}
    if(keys['ArrowUp']){S.menuIdx=clamp(S.menuIdx-1,0,3);keys['ArrowUp']=false}
  }
  else if(S.screen==='charSelect'){
    if(keys['Enter']){startGame();keys['Enter']=false}
    if(keys['ArrowRight']){const chars=Object.keys(CHARS),i=chars.indexOf(S.selectedChar);S.selectedChar=chars[(i+1)%chars.length];keys['ArrowRight']=false}
    if(keys['ArrowLeft']){const chars=Object.keys(CHARS),i=chars.indexOf(S.selectedChar);S.selectedChar=chars[(i-1+chars.length)%chars.length];keys['ArrowLeft']=false}
    if(keys['Escape']){S.screen='title';keys['Escape']=false}
  }
  else if(S.screen==='shop'||S.screen==='locker'||S.screen==='achievements'){
    if(keys['Escape']){S.screen='title';keys['Escape']=false}
    if(S.screen==='shop'){if(keys['Enter']){buyUpgrade(S.shopIdx);keys['Enter']=false}if(keys['ArrowDown']){S.shopIdx=clamp(S.shopIdx+1,0,META_UPGRADES.length-1);keys['ArrowDown']=false}if(keys['ArrowUp']){S.shopIdx=clamp(S.shopIdx-1,0,META_UPGRADES.length-1);keys['ArrowUp']=false}}
  }
  else if(S.screen==='levelup'){
    if(keys['1']){applyChoice(S.levelUpChoices[0]);keys['1']=false}
    if(keys['2']){applyChoice(S.levelUpChoices[1]);keys['2']=false}
    if(keys['3']){applyChoice(S.levelUpChoices[2]);keys['3']=false}
  }
  else if(S.screen==='game'){
    if(keys['p']||keys['Escape']){S.screen='paused';S.paused=true;keys['p']=false;keys['Escape']=false}
  }
  else if(S.screen==='paused'){
    if(keys['p']||keys['Escape']||keys['Enter']){S.screen='game';S.paused=false;keys['p']=false;keys['Escape']=false;keys['Enter']=false}
  }
  else if(S.screen==='gameover'){
    if(keys['Enter']){resetGame();S.screen='title';keys['Enter']=false}
  }
}

// ============ GAME FLOW ============
function startGame(){
  const cid=S.selectedChar;
  if(!(META.charUnlocks[cid]||cid==='fox'||cid==='sirOofie')){
    const cost=CHAR_COSTS[cid]||100;
    if(META.gold>=cost){META.gold-=cost;META.charUnlocks[cid]=true;saveMeta()}
    else return;
  }
  S.player=createPlayer(cid);
  S.xp=0;S.xpToLevel=10;S.level=1;S.gold=0;S.silver=0;
  S.wave=1;S.waveTimer=0;S.spawnTimer=0;S.difficulty=1;
  S.kills=0;S.runKills=0;S.runGold=0;S.runTime=0;S.bossActive=false;S.boss=null;
  S.enemies=[];S.projectiles=[];S.particles=[];S.drops=[];S.damageNums=[];
  S.interactables=[];S.screenShake=0;S.paused=false;S.hitFlash=0;S.waveAnnounce=0;S._banked=false;
  spawnChest(rand(100,S.worldW-100),rand(100,S.worldH-100));
  spawnShrine(rand(100,S.worldW-100),rand(100,S.worldH-100));
  S.screen='game';
  announce('WAVE 1 - SURVIVE!');
}
function resetGame(){
  S.player=null;S.enemies=[];S.projectiles=[];S.particles=[];S.drops=[];S.damageNums=[];S.interactables=[];S.levelUpChoices=[];S.paused=false;S.screenShake=0;S._banked=false;
}

// ============ MAIN LOOP ============
function update(){
  S.t++;S.runTime++;
  if(S.screen==='game'&&!S.paused){
    const dt=Math.min(S.dt,3);
    updatePlayer(dt);updateEnemies(dt);updateProjectiles(dt);updateDrops(dt);updateInteractables();
    S.spawnTimer+=dt;
    if(S.spawnTimer>=S.spawnRate){S.spawnTimer=0;spawnWave()}
    S.waveTimer+=dt;
    if(S.waveTimer>=S.waveInterval){S.waveTimer=0;S.wave++}
    if(S.bossActive&&(!S.boss||S.boss.hp<=0)){S.bossActive=false;S.boss=null;announce('BOSS DOWN!')}
    if(S.player&&S.player.hp<=0){S.screen='gameover';S.paused=true;checkAchievements()}
    if(S.screenShake>0){S.screenShake*=0.9;if(S.screenShake<0.1)S.screenShake=0}
  }
}
let lastFrameTime=0;
function gameLoop(now){
  const rawDt=lastFrameTime?(now-lastFrameTime)/16.67:1;
  S.dt=Math.min(rawDt,3);
  lastFrameTime=now;
  handleInput();update();render();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
